# Render Blueprint: database + API + static frontend.
# Render dashboard -> New -> Blueprint -> pick this repo.
# After the first deploy, set the two variables marked "sync: false" (see README).
databases:
  - name: hfr-db
    databaseName: hfr
    user: hfr
    plan: free
    region: singapore

services:
  - type: web
    name: hfr-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hfr-db
          property: connectionString
      - key: CORS_ORIGINS          # the frontend URL, e.g. https://hfr-web.onrender.com
        sync: false
      - key: SEARCH_RATE_LIMIT_PER_MIN
        value: "60"

  - type: web
    name: hfr-web
    runtime: static
    region: singapore
    staticPublishPath: frontend
    buildCommand: echo "window.HFR_CONFIG = { API_BASE: \"$API_BASE\" };" > frontend/config.js
    envVars:
      - key: API_BASE              # the API URL, e.g. https://hfr-api.onrender.com (no trailing slash)
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
