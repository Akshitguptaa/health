# One command local setup:  docker compose up --build
#   frontend  http://localhost:8080
#   api docs  http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hfr
      POSTGRES_PASSWORD: hfr        # local-only default; use real secrets when deploying
      POSTGRES_DB: hfr
    ports:
      - "${DB_PORT:-5432}:5432"       # set DB_PORT=5433 if a local Postgres already uses 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/snapshots:ro        # optional: put a pg_dump snapshot in ./data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hfr -d hfr"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://hfr:hfr@db:5432/hfr
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-8080}
      SEARCH_RATE_LIMIT_PER_MIN: "60"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-8080}:80"   # some Windows machines reserve 8080: set FRONTEND_PORT=8090

  # Not started by default. Load facility data:
  #   docker compose --profile tools run --rm scraper ingest /data/raw
  scraper:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app/scraper
    entrypoint: ["python", "-m", "hfr_scraper"]
    environment:
      DATABASE_URL: postgresql://hfr:hfr@db:5432/hfr
      SCRAPER_USER_AGENT: ${SCRAPER_USER_AGENT:-HealthFacilityFinderBot/0.1}
      SCRAPER_DELAY_SECONDS: ${SCRAPER_DELAY_SECONDS:-2.0}
      NHPR_API_KEY: ${NHPR_API_KEY:-}
      NHPR_API_BASE: ${NHPR_API_BASE:-https://apinhpr.abdm.gov.in/v4/hfr}
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
